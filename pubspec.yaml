name: ewallet_flutter
description: A rich, secure cross-platform eWallet mobile application for Android & iOS built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Reactive Architecture
  provider: ^6.1.2

  # Secure Local Storage & Database (SQLite / Keystore / Keychain)
  sqflite: ^2.4.1
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # Cryptography & Vault Security
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # Document Scanning, Camera & Receipts
  image_picker: ^1.1.2
  camera: ^0.11.0+1
  file_picker: ^8.0.7
  share_plus: any

  # Utilities & Formatting
  uuid: ^4.4.0
  intl: ^0.19.0
  
  # Styling & Typography
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: 0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
